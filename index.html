<title>Hub de Programas Estratégicos</title>

    · cada outra aba    → um projeto (abas iniciadas com "_" ou ocultas são ignoradas)
    · dentro da aba     → seções VISÃO GERAL, ESCOPO, GOVERNANÇA, MATRIZ RACI,

                    2) planilha no mesmo endereço do HTML (PLANILHA)

                    4) retrato publicado, embutido no final deste arquivo

<script>

  var r=document.documentElement,t=null,s=null;

  var escuro=(t==='dark'||t==='light')?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);

<style>
:root{
  --navy:#0B2D5B; --navy-deep:#071B36; --blue:#0090DA; --green:#8DBF2E;
  --green-deep:#3D7A1E; --teal:#00A3A1; --amber:#D99100; --red:#C8443F;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#F8FAFE;
  --ink:#0B2D5B; --ink-2:#52678A; --ink-3:#8296B4;
  --line:#E2E9F4; --line-2:#CFDAEC;
  --rail:#071B36; --rail-2:#0E2A4E; --rail-ink:#C6D6EC; --rail-ink-2:#7A93B8;
  --r:11px; --r-lg:16px; --sb:272px;
  --shadow:0 1px 2px rgba(7,27,54,.05), 0 10px 30px -14px rgba(7,27,54,.16);
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --mono:Consolas,"Courier New",monospace;
  color-scheme:light;
}
html[data-mode="dark"]{
  --bg:#08192E; --surface:#0E2340; --surface-2:#0B1D36;
  --ink:#E9F1FC; --ink-2:#9DB4D4; --ink-3:#6F89AE;
  --line:#1B3559; --line-2:#244170;
  --rail:#050F1F; --rail-2:#0B2140;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (min-width:861px){ html[data-sb="collapsed"]{--sb:68px;} }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; -webkit-font-smoothing:antialiased;}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
button{font-family:inherit; font-size:inherit; color:inherit;}
a{color:var(--blue);}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
.hide{display:none!important;}
svg.i{width:17px; height:17px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.pre{white-space:pre-line;}
.muted{color:var(--ink-3);}

/* SIDEBAR */
.rail{width:var(--sb); background:var(--rail); color:var(--rail-ink); display:flex; flex-direction:column; position:fixed; inset:0 auto 0 0;
  z-index:60; border-right:1px solid rgba(255,255,255,.06); transition:width .22s ease, transform .25s ease; overflow:hidden;}
.rail-head{display:flex; align-items:center; gap:11px; padding:18px 18px 15px; border-bottom:1px solid rgba(255,255,255,.07); min-height:74px;}
.logo-mark{width:30px; height:auto; flex-shrink:0; display:block;}
.logo-txt{font-weight:bold; font-size:14px; color:#fff; line-height:1.25;}
.logo-sub{font-size:11px; color:var(--rail-ink-2); margin-top:2px; white-space:nowrap;}
.rail-search{padding:12px 14px 4px;}
.rail-search input{width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.09); color:#fff; border-radius:8px;
  padding:8px 11px; font-size:13px; outline:none; font-family:inherit;}
.rail-search input::placeholder{color:var(--rail-ink-2);}
.rail-search input:focus{border-color:var(--blue); background:rgba(255,255,255,.1);}
.rail-nav{padding:8px 10px 2px;}
.nav-home{display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; color:var(--rail-ink); padding:9px 12px;
  border-radius:9px; cursor:pointer; font-size:13.2px; position:relative; white-space:nowrap;}
.nav-home:hover{background:rgba(255,255,255,.055); color:#fff;}
.nav-home.active{background:var(--rail-2); color:#fff; font-weight:bold;}
.nav-home.active::before,.proj-item.active::before{content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--green);}
.rail-label{padding:12px 18px 6px; font-size:10.5px; font-weight:bold; letter-spacing:.08em; color:var(--rail-ink-2); display:flex; justify-content:space-between; white-space:nowrap;}
.rail-list{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 10px 10px;}
.proj-item{display:block; width:100%; text-align:left; background:transparent; border:0; cursor:pointer; padding:9px 12px 9px 13px; border-radius:9px; margin-bottom:2px; position:relative;}
.proj-item:hover{background:rgba(255,255,255,.055);}
.proj-item.active{background:var(--rail-2);}
.proj-row{display:flex; align-items:center; gap:8px;}
.dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block;}
.dot.on-track{background:var(--green);} .dot.atencao{background:var(--amber);} .dot.risco{background:var(--red);}
.dot.concluido{background:var(--blue);} .dot.planejamento{background:var(--ink-3);}
.proj-name{font-size:13.2px; color:var(--rail-ink); line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.proj-item.active .proj-name{color:#fff; font-weight:bold;}
.proj-meta{font-size:11px; color:var(--rail-ink-2); padding-left:15px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.proj-mini{display:none; width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,.07); color:var(--rail-ink);
  align-items:center; justify-content:center; font-size:12px; font-weight:bold; position:relative;}
.proj-item.active .proj-mini{background:var(--rail-2); color:#fff; box-shadow:inset 0 0 0 1.5px var(--green);}
.proj-mini .dot{position:absolute; top:-2px; right:-2px; width:10px; height:10px; border:2px solid var(--rail);}
.rail-foot{padding:12px 14px 16px; border-top:1px solid rgba(255,255,255,.07);}
.ro-note{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px; font-size:11.5px; line-height:1.35;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); color:var(--rail-ink-2);}
.ro-note b{display:block; color:#fff; font-size:11.8px;}
@media (min-width:861px){
  html[data-sb="collapsed"] .rail .txt{display:none!important;}
  html[data-sb="collapsed"] .rail-head{justify-content:center; padding:18px 0 15px;}
  html[data-sb="collapsed"] .rail-search, html[data-sb="collapsed"] .rail-label{display:none;}
  html[data-sb="collapsed"] .rail-nav{padding:12px 10px 8px;}
  html[data-sb="collapsed"] .nav-home{justify-content:center; padding:11px 0;}
  html[data-sb="collapsed"] .rail-list{padding:4px 10px 10px;}
  html[data-sb="collapsed"] .proj-item{display:flex; justify-content:center; padding:5px 0;}
  html[data-sb="collapsed"] .proj-item.active{background:transparent;}
  html[data-sb="collapsed"] .proj-item.active::before{display:none;}
  html[data-sb="collapsed"] .proj-full{display:none;}
  html[data-sb="collapsed"] .proj-mini{display:flex;}
  html[data-sb="collapsed"] .rail-foot{padding:12px 12px 16px;}
  html[data-sb="collapsed"] .ro-note{justify-content:center; padding:10px 0;}
}

/* MAIN */
.main{margin-left:var(--sb); min-width:0; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .22s ease;}
.topbar{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line); padding:0 22px 0 14px; display:flex; align-items:center; gap:12px; height:56px;}
.crumb{font-size:12.5px; color:var(--ink-3); display:flex; align-items:center; gap:7px; min-width:0; white-space:nowrap; overflow:hidden;}
.crumb a{color:var(--ink-3); cursor:pointer; text-decoration:none;}
.crumb a:hover{color:var(--blue);}
.crumb b{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis;}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
.icon-btn{width:34px; height:34px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;}
.icon-btn:hover{border-color:var(--blue); color:var(--blue);}
.theme-btn .i-sun{display:none;}
html[data-mode="dark"] .theme-btn .i-sun{display:block;}
html[data-mode="dark"] .theme-btn .i-moon{display:none;}
.ref{font-size:11.5px; color:var(--ink-3); white-space:nowrap;}
.ref b{color:var(--ink-2);}
.ro-badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:bold; color:var(--ink-2); background:var(--bg);
  border:1px solid var(--line); border-radius:999px; padding:5px 11px; white-space:nowrap;}
.ro-badge svg.i{width:13px; height:13px;}
.alerta-dados{margin:16px 32px 0; padding:12px 16px; border-radius:10px; background:rgba(200,68,63,.1); border:1px solid rgba(200,68,63,.35); color:var(--red); font-size:12.8px; line-height:1.5;}

/* HOME */
.home{padding:30px 32px 40px; max-width:1260px;}
.hero{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:38px 40px 32px; overflow:hidden;}
.hero::before{content:''; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--navy),var(--blue) 40%,var(--teal) 70%,var(--green));}
.hero-grid{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:44px; align-items:start;}
.kicker{font-size:11px; letter-spacing:.14em; font-weight:bold; color:var(--blue); margin-bottom:14px;}
.hero h1{font-size:34px; line-height:1.1; margin:0 0 14px; letter-spacing:-.6px;}
.hero-lead{margin:0; font-size:15.5px; line-height:1.6; color:var(--ink-2); white-space:pre-line;}
.hero-meta{margin-top:18px; font-size:12px; color:var(--ink-3); display:flex; gap:16px; flex-wrap:wrap;}
.hero-meta b{color:var(--ink-2);}
.guide{border-left:1px solid var(--line); padding-left:32px;}
.guide h3{margin:0 0 14px; font-size:11px; letter-spacing:.12em; color:var(--ink-3);}
.guide-step{display:flex; gap:13px; margin-bottom:15px;}
.guide-step .n{width:24px; height:24px; border-radius:7px; background:var(--bg); border:1px solid var(--line); display:grid; place-items:center; font-size:11.5px; font-weight:bold; color:var(--blue); flex-shrink:0;}
.guide-step b{display:block; font-size:13px; margin-bottom:2px;}
.guide-step span{font-size:12.3px; color:var(--ink-2); line-height:1.45;}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); margin-top:18px; overflow:hidden;}
.kpi{padding:18px 22px; border-right:1px solid var(--line); min-width:0;}
.kpi:last-child{border-right:0;}
.kpi .k{font-size:10.5px; font-weight:bold; letter-spacing:.07em; color:var(--ink-3); margin-bottom:8px;}
.kpi .v{font-size:28px; font-weight:bold; line-height:1; letter-spacing:-.5px;}
.kpi .s{font-size:12px; color:var(--ink-3); margin-top:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.kpi .v.sm{font-size:19px; letter-spacing:-.2px;}
.good{color:var(--green-deep);} html[data-mode="dark"] .good{color:#A9D65A;}
.warn{color:var(--amber);}
.sec-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:34px 0 14px; flex-wrap:wrap;}
.sec-head h2{margin:0; font-size:17px; letter-spacing:-.2px;}
.sec-head p{margin:3px 0 0; font-size:12.5px; color:var(--ink-3);}
.fchips{display:flex; gap:6px; flex-wrap:wrap;}
.fchip{padding:5px 12px; border-radius:999px; font-size:12px; font-weight:bold; cursor:pointer; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-3);}
.fchip:hover{color:var(--ink-2);}
.fchip.on{background:var(--navy); border-color:var(--navy); color:#fff;}
html[data-mode="dark"] .fchip.on{background:var(--blue); border-color:var(--blue);}
.pcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px;}
.pcard{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px 18px 16px; cursor:pointer;
  box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s ease; display:flex; flex-direction:column; gap:10px;}
.pcard:hover{transform:translateY(-2px); border-color:var(--blue);}
.pcard-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.pcard h3{margin:0; font-size:15.5px; line-height:1.3;}
.pcard .d{font-size:12.6px; color:var(--ink-2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:38px;}
.pcard-meta{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding-top:10px; border-top:1px solid var(--line);}
.pcard-meta .k{font-size:10px; font-weight:bold; letter-spacing:.07em; color:var(--ink-3); margin-bottom:3px;}
.pcard-meta .v{font-size:13px; font-weight:bold;}
.pcard-foot{display:flex; justify-content:space-between; font-size:11.8px; color:var(--ink-3);}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:34px;}
.lcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden;}
.lcard-h{padding:16px 20px 12px; display:flex; justify-content:space-between; align-items:baseline;}
.lcard-h h3{margin:0; font-size:14.5px;}
.lcard-h span{font-size:12px; color:var(--ink-3);}
.li{display:flex; align-items:center; gap:14px; padding:12px 20px; border-top:1px solid var(--line); cursor:pointer;}
.li:hover{background:var(--surface-2);}
.li-main{flex:1; min-width:0;}
.li-main b{display:block; font-size:13.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.li-main span{font-size:11.8px; color:var(--ink-3);}
.li-end{font-size:12px; color:var(--ink-3); text-align:right; white-space:nowrap;}
.li-end.late{color:var(--red); font-weight:bold;}
.dchip{width:46px; text-align:center; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); padding:5px 0; flex-shrink:0;}
.dchip b{display:block; font-size:16px; line-height:1.1;}
.dchip span{font-size:9.5px; font-weight:bold; letter-spacing:.06em; color:var(--ink-3);}
.li-empty{padding:26px 20px; border-top:1px solid var(--line); font-size:12.8px; color:var(--ink-3); text-align:center;}

/* PROJETO */
.phead{padding:24px 28px 0; background:var(--surface); border-bottom:1px solid var(--line);}
.phead-top{display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap;}
.phead h1{margin:0; font-size:23px; line-height:1.2;}
.pdesc{margin:5px 0 0; max-width:72ch; font-size:13.5px; line-height:1.5; color:var(--ink-2);}
.stats{display:flex; gap:26px; margin-left:auto; flex-wrap:wrap;}
.stat{min-width:78px;}
.stat .k{font-size:10.5px; font-weight:bold; letter-spacing:.06em; color:var(--ink-3); margin-bottom:3px;}
.stat .v{font-size:17px; font-weight:bold;}
.stat .v.mono{font-size:16px;}
.stat .v small{font-size:11.5px; color:var(--ink-3);}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:11.8px; font-weight:bold; border:1px solid; white-space:nowrap;}
.pill.on-track{background:rgba(141,191,46,.12); color:var(--green-deep); border-color:rgba(141,191,46,.35);}
.pill.atencao{background:rgba(217,145,0,.12); color:var(--amber); border-color:rgba(217,145,0,.35);}
.pill.risco{background:rgba(200,68,63,.11); color:var(--red); border-color:rgba(200,68,63,.32);}
.pill.concluido{background:rgba(0,144,218,.11); color:var(--blue); border-color:rgba(0,144,218,.32);}
.pill.planejamento{background:rgba(130,150,180,.13); color:var(--ink-2); border-color:var(--line-2);}
html[data-mode="dark"] .pill.on-track{color:#A9D65A;}
.phase-tag{font-size:9.5px; font-weight:bold; padding:2px 7px; border-radius:4px; color:#fff; white-space:nowrap;}
.tabs{display:flex; gap:2px; margin-top:18px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{border:0; background:transparent; color:var(--ink-3); cursor:pointer; white-space:nowrap; padding:10px 13px; font-size:13px; font-weight:bold; border-bottom:2.5px solid transparent; display:flex; align-items:center; gap:7px;}
.tab:hover{color:var(--ink-2);}
.tab.on{color:var(--ink); border-bottom-color:var(--blue);}
.tab .cnt{font-size:10.5px; background:var(--bg); color:var(--ink-3); padding:1px 6px; border-radius:999px; border:1px solid var(--line);}
.tab.on .cnt{background:rgba(0,144,218,.13); color:var(--blue); border-color:transparent;}
.content{padding:24px 28px 40px; max-width:1260px;}
.block{margin-bottom:22px;}
.block-head{display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.block-head h2{margin:0; font-size:15px;}
.block-head p{margin:0; font-size:12.5px; color:var(--ink-3);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);}
.card-pad{padding:20px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.note{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); border-top:3px solid var(--line-2); padding:15px 16px; min-height:120px;}
.note.good-t{border-top-color:var(--green);} .note.warn-t{border-top-color:var(--amber);} .note.next-t{border-top-color:var(--blue);}
.note h3{margin:0 0 8px; font-size:12.5px; display:flex; align-items:center; gap:7px;}
.note p{margin:0; font-size:13.3px; line-height:1.55; color:var(--ink-2); white-space:pre-line;}
.lbl{display:block; font-size:10.5px; font-weight:bold; letter-spacing:.055em; color:var(--ink-3); margin-bottom:5px;}
.val{font-size:13.4px; line-height:1.45;}
.f{margin-bottom:14px;}
.rows{display:flex; flex-direction:column; gap:10px;}
.row-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; border-left:3px solid var(--blue);}
.row-card h4{margin:0 0 5px; font-size:14px;}
.row-card .d{margin:0 0 10px; font-size:13px; line-height:1.5; color:var(--ink-2); white-space:pre-line;}
.bdg{display:inline-block; padding:3.5px 10px; border-radius:999px; font-size:11.5px; font-weight:bold; border:1px solid;}
.bdg[data-t=escopo]{background:rgba(0,144,218,.1); color:var(--blue); border-color:rgba(0,144,218,.3);}
.bdg[data-t=decisao]{background:rgba(217,145,0,.12); color:var(--amber); border-color:rgba(217,145,0,.33);}
.bdg[data-t=risco]{background:rgba(200,68,63,.1); color:var(--red); border-color:rgba(200,68,63,.3);}
.bdg[data-t=feito]{background:rgba(141,191,46,.13); color:var(--green-deep); border-color:rgba(141,191,46,.35);}
.bdg[data-t=fora]{background:transparent; color:var(--ink-3); border-color:var(--line-2);}
html[data-mode="dark"] .bdg[data-t=feito]{color:#A9D65A;}
.gov{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; background:var(--surface);}
.gov-col{padding:18px; border-right:1px solid var(--line);}
.gov-col:last-child{border-right:0;}
.gov-col h3{margin:0 0 2px; font-size:13.5px; display:flex; align-items:center; gap:8px;}
.gov-col .bar{width:22px; height:3px; border-radius:2px;}
.gov-col p{margin:0 0 14px; font-size:11.8px; color:var(--ink-3); line-height:1.45;}
.gov-col[data-l=d] .bar{background:var(--navy);} .gov-col[data-l=g] .bar{background:var(--blue);} .gov-col[data-l=e] .bar{background:var(--green);}
html[data-mode="dark"] .gov-col[data-l=d] .bar{background:#5B86C4;}
.person{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; margin-bottom:7px;}
.person b{display:block; font-size:12.5px;}
.person span{font-size:12px; color:var(--ink-2);}
.gov-vazio{font-size:12px; color:var(--ink-3); padding:6px 0;}

/* RACI */
.raci-tools{display:flex; flex-direction:column; gap:9px; margin-bottom:12px;}
.raci-row{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.raci-row .lab{font-size:11px; font-weight:bold; letter-spacing:.06em; color:var(--ink-3); width:52px;}
.chip{padding:5px 12px; border-radius:999px; font-size:12px; font-weight:bold; cursor:pointer; border:1.5px solid var(--line-2); background:var(--surface);
  color:var(--ink-3); display:inline-flex; align-items:center; gap:6px; user-select:none;}
.chip:hover{color:var(--ink-2);}
.chip[data-f=A].on{border-color:var(--navy); color:#fff; background:var(--navy);}
.chip[data-f=R].on{border-color:var(--blue); color:#fff; background:var(--blue);}
.chip[data-f=C].on{border-color:var(--green); color:#173400; background:var(--green);}
.chip[data-f=I].on{border-color:var(--ink-2); color:var(--ink); background:var(--bg);}
.chip.fase.on{color:#fff;}
.chip .sw{width:8px; height:8px; border-radius:2px;}
.raci-status{display:flex; align-items:center; gap:10px; font-size:12.3px; color:var(--ink-2); padding:9px 13px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; margin-bottom:10px;}
.raci-status b{color:var(--ink);}
.raci-status .clr{margin-left:auto; border:0; background:transparent; color:var(--blue); font-weight:bold; cursor:pointer; font-size:12.3px;}
.raci-wrap{border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; background:var(--surface);}
table.raci{width:100%; border-collapse:collapse; table-layout:fixed; font-size:11.5px;}
table.raci th{background:var(--navy); color:#fff; font-size:10.8px; padding:9px 5px; border-right:1px solid rgba(255,255,255,.12); cursor:pointer; line-height:1.25; word-break:break-word;}
html[data-mode="dark"] table.raci th{background:#123763;}
table.raci th:first-child{text-align:left; padding-left:13px; cursor:default;}
table.raci th.hl{background:var(--blue)!important;}
table.raci td{border-top:1px solid var(--line); border-right:1px solid var(--line); padding:0; text-align:center;}
table.raci td:last-child, table.raci th:last-child{border-right:0;}
table.raci td.hl{background:rgba(0,144,218,.07);}
table.raci td.nm{text-align:left; padding:9px 10px 9px 11px; font-size:12px; font-weight:bold;}
table.raci td.nm .fz{display:block; font-size:10px; margin-top:2px;}
tr.dim td{opacity:.35;}
.cell{display:flex; align-items:center; justify-content:center; width:100%; height:38px; font-weight:bold; font-size:10.5px; color:var(--ink-3);}
.cell[data-v="A"]{background:var(--navy); color:#fff;}
html[data-mode="dark"] .cell[data-v="A"]{background:#2F5E9E;}
.cell[data-v="R"]{background:var(--blue); color:#fff;}
.cell[data-v="C"]{background:var(--green); color:#173400;}
.cell[data-v="I"]{color:var(--ink-2); box-shadow:inset 0 0 0 1.5px var(--line-2); border-radius:6px; width:calc(100% - 10px); height:28px; margin:5px;}
.cell[data-v="A/R"]{background:linear-gradient(135deg,var(--navy) 50%,var(--blue) 50%); color:#fff;}
.cell[data-v="R/C"]{background:linear-gradient(135deg,var(--blue) 50%,var(--green) 50%); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35);}
.cell.off{opacity:.12;}
.raci-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3); margin-top:10px; align-items:center;}
.raci-legend i{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-3px; margin-right:5px;}

/* TABELAS */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%; border-collapse:collapse; font-size:12.8px; table-layout:fixed;}
.tbl th{text-align:left; font-size:10.3px; font-weight:bold; letter-spacing:.05em; color:var(--ink-3); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); line-height:1.3;}
.tbl th.num, .tbl td.num{text-align:center;}
.tbl td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; line-height:1.4; overflow-wrap:anywhere;}
.tbl td.num{font-family:var(--mono);}
.tbl tr:last-child td{border-bottom:0;}
.st{font-weight:bold; font-size:12px;}
.st.ok{color:var(--green-deep);} .st.andamento{color:var(--blue);} .st.pendente{color:var(--amber);} .st.bloqueado{color:var(--red);}
html[data-mode="dark"] .st.ok{color:#A9D65A;}
.meter{height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
.meter i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--blue),var(--green));}
.rowprog{display:flex; align-items:center; gap:7px;}
.rowprog .meter{flex:1;}
.rowprog span{font-size:11px; color:var(--ink-3); width:34px; text-align:right; font-family:var(--mono);}
.kstrip{display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;}
.kstrip > div{padding:15px 18px; border-right:1px solid var(--line); min-width:0;}
.kstrip > div:last-child{border-right:0;}
.kstrip .k{font-size:10.3px; font-weight:bold; letter-spacing:.06em; color:var(--ink-3); margin-bottom:6px;}
.kstrip .v{font-size:24px; font-weight:bold; line-height:1;}
.kstrip .s{font-size:11.5px; color:var(--ink-3); margin-top:6px;}
.kstrip .meter{margin-top:8px;}
.ap-grid{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr); gap:12px;}
.ap-ref{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.ap-ref .val{flex:1; min-width:200px;}
.ev{display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2);
  font-size:12px; font-weight:bold; color:var(--ink); text-decoration:none;}
.ev:hover{border-color:var(--blue); color:var(--blue);}
.ev svg.i{width:14px; height:14px;}
.empty{text-align:center; padding:40px 20px; color:var(--ink-3); background:var(--surface); border:1px dashed var(--line-2); border-radius:var(--r-lg);}
.empty h3{margin:0 0 6px; font-size:15px; color:var(--ink-2);}
.empty p{margin:0; font-size:13px;}

/* RODAPÉ */
.pfoot{display:flex; align-items:center; justify-content:flex-end; gap:16px; margin-top:36px; padding-top:18px; border-top:1px solid var(--line);}
.pfoot .fmeta{font-size:11.5px; color:var(--ink-3); text-align:right; line-height:1.5;}
.pfoot .flogo img{height:30px; width:auto; max-width:200px; display:block;}
.pfoot .lg-d{display:none!important;}
html[data-mode="dark"] .pfoot .lg-l{display:none!important;}
html[data-mode="dark"] .pfoot .lg-d{display:block!important;}
.fname{font-size:13px; font-weight:bold; color:var(--ink-2);}
.scrim{position:fixed; inset:0; background:rgba(4,12,24,.5); z-index:55;}

@media (max-width:1080px){
  .grid-3{grid-template-columns:1fr;} .gov{grid-template-columns:1fr;} .gov-col{border-right:0; border-bottom:1px solid var(--line);}
  .hero-grid{grid-template-columns:1fr; gap:28px;} .guide{border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:24px;}
  .kstrip{grid-template-columns:repeat(3,1fr);} .kstrip > div{border-bottom:1px solid var(--line);}
}
@media (max-width:860px){
  .rail{width:272px; transform:translateX(-100%); box-shadow:0 0 50px rgba(0,0,0,.4);}
  body.nav-open .rail{transform:translateX(0);}
  .main{margin-left:0;}
  .stats{margin-left:0; width:100%; gap:18px;}

[hidden]{display:none!important;}
.dot.sem-status{background:transparent; box-shadow:inset 0 0 0 1.5px var(--ink-3);}
.pill.sem-status{background:transparent; color:var(--ink-3); border-color:var(--line-2); border-style:dashed;}
.passo-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.passo-top h4{margin:0;}

.icon-btn.hl-btn{border-color:var(--blue); color:var(--blue);}
.drop{position:fixed; inset:0; z-index:90; background:rgba(7,27,54,.72); display:flex; align-items:center; justify-content:center; pointer-events:none;}
.drop div{border:2px dashed #fff; border-radius:20px; padding:40px 56px; color:#fff; font-size:17px; font-weight:bold; text-align:center;}
.drop span{display:block; font-size:12.5px; font-weight:normal; opacity:.8; margin-top:6px;}

.loadbox h2{margin:12px 0 8px; font-size:20px;}
.loadbox p{margin:0 0 20px; color:var(--ink-2); line-height:1.55; font-size:13.5px;}
.loadbox .big{width:54px; height:54px; border-radius:14px; display:inline-grid; place-items:center; background:rgba(0,144,218,.1); color:var(--blue);}
.loadbox .big svg.i{width:26px; height:26px;}
.btn{display:inline-flex; align-items:center; gap:8px; border:0; border-radius:10px; background:var(--navy); color:#fff; padding:11px 18px; font-weight:bold; cursor:pointer; font-size:13.5px;}
html[data-mode="dark"] .btn{background:var(--blue);}
.btn:hover{filter:brightness(1.12);}
.toast{position:fixed; right:20px; bottom:20px; z-index:95; background:var(--navy-deep); color:#fff; padding:12px 16px; border-radius:10px; font-size:12.8px; box-shadow:0 10px 30px rgba(0,0,0,.3); max-width:360px; line-height:1.45;}
.spin{width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:gira .8s linear infinite; margin:0 auto;}
@keyframes gira{to{transform:rotate(360deg);}}
</style>

<script>
/* ═══ CONFIGURAÇÃO ═══
   PLANILHA: nome ou endereço do arquivo Excel lido ao abrir o hub.
   Funciona quando o HTML está publicado num servidor/site junto da planilha.
   Aberto direto do computador (duplo clique), o hub usa o retrato embutido.  */
const PLANILHA = 'HUB_PROGRAMAS.xlsx';
/* LINK DOS DADOS — URL do App da Web do Apps Script (termina em /exec).
   O script (apps-script-hub.gs) fica dentro da planilha Google e entrega todas
   as abas em JSON a cada abertura do hub. Trocou a implantação? Troque o link aqui. */
const ONEDRIVE_URL = '';
function candidatosOneDrive(u){
  if(!u) return [];
  const g=u.match(/docs\.google\.com\/spreadsheets\/d\/(e\/)?([\w-]+)/);
  if(g&&g[1]) return [{url:'https://docs.google.com/spreadsheets/d/e/'+g[2]+'/pub?output=xlsx',cred:'omit'}];   /* link "Publicar na Web" */
  if(g)       return [{url:'https://docs.google.com/spreadsheets/d/'+g[2]+'/export?format=xlsx',cred:'omit'}];
  const sep=u.includes('?')?'&':'?';
  return [{url:u+sep+'download=1',cred:'omit'}];
}

const LOGOS = { claro: '', escuro: '' };   /* logos do rodapé (data URI) — vazio mostra "MetLife Brasil" */

const esc=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>(s??'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
const num=v=>{const n=Number(v); return isFinite(n)&&n>0?n:0;};
const vazio=v=>(v===undefined||v===null||String(v).trim()==='');
const txt=v=>vazio(v)?'—':esc(v);

/* ═══ LEITURA DA PLANILHA ═══ */
function arr(v){return Array.isArray(v)?v:[];}
const p2=n=>String(n).padStart(2,'0');
function valorCelula(c){
  if(!c||c.v===undefined||c.v===null) return '';
  if(c.t==='n'&&c.z&&XLSX.SSF.is_date(c.z)){ const d=XLSX.SSF.parse_date_code(c.v); if(d) return d.y+'-'+p2(d.m)+'-'+p2(d.d); }
  if(c.t==='d'&&c.v instanceof Date) return c.v.getFullYear()+'-'+p2(c.v.getMonth()+1)+'-'+p2(c.v.getDate());
  if(c.t==='n') return c.v;
  if(c.t==='b') return c.v?'Sim':'Não';
  return String(c.v).replace(/\r\n?/g,'\n').trim();
}
function grade(ws){
  if(!ws||!ws['!ref']) return [];
  const R=XLSX.utils.decode_range(ws['!ref']), g=[];
  for(let r=0;r<=R.e.r;r++){ const row=[]; for(let c=0;c<=Math.max(R.e.c,10);c++) row.push(valorCelula(ws[XLSX.utils.encode_cell({r,c})])); g.push(row); }
  return g;
}
const rot=v=>norm(String(v??'').replace(/:\s*$/,''));          /* rótulo normalizado sem ":" */
const ehRot=v=>typeof v==='string'&&/:\s*$/.test(v);            /* "Algo:" */
function cheio(row){ return row.some(v=>!vazio(v)); }
/* valor(es) logo abaixo de um rótulo, na mesma coluna, até a primeira célula vazia */
function abaixo(g,r,c,multi){
  const out=[]; for(let i=r+1;i<g.length;i++){ const v=g[i][c]; if(vazio(v)||ehRot(v)) break; out.push(v); if(!multi) break; }
  return multi?out.join('\n'):(out[0]??'');
}
function achar(g,r0,r1,teste){ for(let r=r0;r<r1;r++) for(let c=0;c<g[r].length;c++){ const v=g[r][c]; if(typeof v==='string'&&teste(rot(v))) return [r,c]; } return null; }
function campo(g,r0,r1,nomes,multi){ const k=achar(g,r0,r1,x=>nomes.includes(x)); return k?abaixo(g,k[0],k[1],multi):''; }

const SECOES=[['visao',/^visao geral$/],['escopo',/^escopo$/],['gov',/^governanca$/],['raci',/^(matriz )?raci$/],['testes',/^testes?$/],
              ['trein',/^treinamentos?$/],['aprov',/^aprovac(oes|ao)$/],['passos',/^(proximos passos|pendencias?)( ?(\/|e) ?(proximos passos|pendencias?))?( e decisoes( em aberto)?)?$/]];
function secoes(g){
  const s=[];
  g.forEach((row,r)=>{ const c=row.findIndex(v=>!vazio(v)); if(c<0||c>3) return; const v=row[c]; if(typeof v!=='string') return;
    const cab=/:\s*$/.test(v)||(v===v.toUpperCase()&&/[A-Z]/.test(v)); if(!cab) return;
    const k=SECOES.find(x=>x[1].test(rot(v))); if(k&&!s.some(x=>x.k===k[0])) s.push({k:k[0],r}); });
  s.sort((a,b)=>a.r-b.r); s.forEach((x,i)=>x.fim=i+1<s.length?s[i+1].r:g.length);
  return s;
}
/* tabela: primeira linha com 2+ células preenchidas é o cabeçalho */
function tabela(g,sec,mapa){
  if(!sec) return [];
  let h=-1; for(let r=sec.r+1;r<sec.fim;r++){ if(g[r].filter(v=>!vazio(v)).length>=2){h=r;break;} }
  if(h<0) return [];
  const cols=[]; g[h].forEach((v,c)=>{ if(vazio(v)) return; const n=rot(v); const m=mapa.find(x=>x[0].test(n)); if(m&&!cols.some(x=>x.k===m[1])) cols.push({c,k:m[1]}); });
  const out=[];
  for(let r=h+1;r<sec.fim;r++){ const o={}; let tem=false; cols.forEach(({c,k})=>{ const v=g[r][c]; o[k]=v; if(!vazio(v)) tem=true; }); if(tem) out.push(o); }
  return out;
}
const M_GOV=[[/camada|nivel/,'camada'],[/papel|funcao/,'papel'],[/quem|nome|responsavel|pessoa/,'quem']];
const M_TES=[[/teste|cenario/,'teste'],[/tipo/,'tipo'],[/responsavel/,'responsavel'],[/periodo|janela/,'periodo'],[/status|situacao/,'status'],
             [/revalid/,'revalidados'],[/sem erro/,'semErro'],[/planejad|previst/,'planejados'],[/validad/,'validados']];
const M_TRE=[[/turma/,'turma'],[/publico/,'publico'],[/data/,'data'],[/hora/,'hora'],[/formato/,'formato'],[/responsavel|instrutor/,'responsavel'],[/status|situacao/,'status']];
const M_APR=[[/^item|aprovad[oa]$|entrega/,'item'],[/quem|aprovador/,'aprovador'],[/data/,'data'],[/status|situacao/,'status'],[/referencia/,'referencia'],[/link|evidencia/,'link']];
const M_PAS=[[/impacto|consequencia|se nao/,'impacto'],[/criticidade|prioridade/,'criticidade'],[/prazo|data/,'prazo'],[/responsavel|dono|quem/,'responsavel'],[/o que|acao|passo|entrega|atividade|descricao|pendencia|decisao/,'acao']];
const M_PEN=[[/dono|responsavel/,'dono'],[/criticidade|prioridade/,'criticidade'],[/prazo|data/,'prazo'],[/pendencia|decisao/,'pendencia']];

function lerRaci(g,sec){
  const vaz={papeis:[],atividades:[]}; if(!sec) return vaz;
  let h=-1; for(let r=sec.r+1;r<sec.fim;r++){ if(g[r].filter(v=>!vazio(v)).length>=2){h=r;break;} }
  if(h<0) return vaz;
  let cA=-1,cF=-1; const pap=[];
  g[h].forEach((v,c)=>{ if(vazio(v)) return; const n=rot(v); if(cA<0&&/atividade|entrega/.test(n)) cA=c; else if(cF<0&&/^fase/.test(n)) cF=c; else pap.push({c,n:String(v).trim()}); });
  if(cA<0) cA=g[h].findIndex(v=>!vazio(v));
  const atv=[];
  for(let r=h+1;r<sec.fim;r++){ const a=g[r][cA]; if(vazio(a)) continue;
    atv.push({atividade:String(a), fase:cF>=0?g[r][cF]:'', valores:pap.map(p=>String(g[r][p.c]??'').trim().toUpperCase())}); }
  return {papeis:pap.map(p=>p.n), atividades:atv};
}
function lerEscopo(g,sec){
  const itens=[]; let obs=''; if(!sec) return {itens,obs};
  let cur=null;
  for(let r=sec.r+1;r<sec.fim;r++) for(let c=0;c<g[r].length;c++){
    const v=g[r][c]; if(!ehRot(v)) continue; const n=rot(v);
    if(/^titulo|^entregavel|^item/.test(n)){ cur={entregavel:abaixo(g,r,c,true),descricao:'',situacao:''}; itens.push(cur); }
    else if(/^descricao/.test(n)&&cur) cur.descricao=abaixo(g,r,c,true);
    else if(/^situacao|^status/.test(n)&&cur) cur.situacao=abaixo(g,r,c);
    else if(/^observacao/.test(n)) obs=abaixo(g,r,c,true);
  }
  return {itens:itens.filter(i=>!vazio(i.entregavel)||!vazio(i.descricao)), obs};
}
function pct(v){ if(typeof v==='number') return Math.round(v<=1?v*100:v); const m=String(v||'').replace(',','.').match(/[\d.]+/); if(!m) return 0; const n=parseFloat(m[0]); return Math.round(/%/.test(v)||n>1?n:n*100); }
function dataTxt(v){ if(vazio(v)) return ''; const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0]; m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m) return (m[3].length===2?'20'+m[3]:m[3])+'-'+p2(m[2])+'-'+p2(m[1]); return s; }

function lerProjeto(nomeAba,g){
  const s=secoes(g), S=k=>s.find(x=>x.k===k), topo=s.length?s[0].r:g.length;
  const v=S('visao'), r0=v?v.r:0, r1=v?v.fim:g.length;
  const esc_=lerEscopo(g,S('escopo'));
  const p={
    aba:nomeAba,
    nome:campo(g,0,topo,['projeto','nome do projeto','programa'])||nomeAba,
    codigo:campo(g,0,topo,['codigo','sigla']),
    descricao:campo(g,0,topo,['descricao'],true),
    status:campo(g,r0,r1,['status']), fase:campo(g,r0,r1,['fase atual','fase']),
    progresso:Math.min(100,pct(campo(g,r0,r1,['progresso','% concluido']))),
    goLive:dataTxt(campo(g,r0,r1,['data de go live','go live','golive'])),
    responsavel:campo(g,r0,r1,['responsavel','gerente do projeto']),
    report:{data:dataTxt(campo(g,r0,r1,['data deste report','data do report'])), avancos:campo(g,r0,r1,['avancos da semana','avancos'],true),
            atencao:campo(g,r0,r1,['pontos de atencao'],true), proximos:campo(g,r0,r1,['proximos passos'],true)},
    escopo:esc_.itens, escopoObs:esc_.obs,
    governanca:tabela(g,S('gov'),M_GOV),
    raci:lerRaci(g,S('raci')),
    testes:tabela(g,S('testes'),M_TES),
    treinamentos:tabela(g,S('trein'),M_TRE).map(t=>({...t,data:dataTxt(t.data)})),
    aprovacoes:tabela(g,S('aprov'),M_APR).map(a=>({...a,data:dataTxt(a.data)})),
    passos:tabela(g,S('passos'),M_PAS).filter(x=>!vazio(x.acao)).map(x=>({...x,prazo:dataTxt(x.prazo)}))
  };
  if(!STATUS.some(x=>norm(x[0])===norm(p.status))) errosDados.push('Aba "'+nomeAba+'": '+(vazio(p.status)?'STATUS vazio':'STATUS "'+p.status+'" fora da lista')+' — o projeto só aparece em "Todos".');
  if(!s.length) errosDados.push('Aba "'+nomeAba+'": nenhuma seção reconhecida (ex.: VISÃO GERAL:).');
  return p;
}
function lerHome(g){
  const c={};
  const textos=[]; for(const row of g){ for(const v of row){ if(!vazio(v)&&typeof v==='string'){ textos.push(v); break; } } if(textos.length>=2) break; }
  c.titulo=textos[0]||''; c.intro=textos[1]||'';
  const k=achar(g,0,g.length,x=>x==='como navegar');
  c.passos=[];
  if(k){ const lin=[]; for(let r=k[0]+1;r<g.length;r++){ const v=g[r][k[1]]; if(vazio(v)) break; lin.push(String(v)); }
    for(let i=0;i<lin.length;i+=2) c.passos.push({t:lin[i],d:lin[i+1]||''}); }
  c.semanaReferencia=dataTxt(campo(g,0,g.length,['semana de referencia','semana']));
  c.atualizadoEm=dataTxt(campo(g,0,g.length,['atualizado em','data da atualizacao']));
  c.atualizadoPor=campo(g,0,g.length,['atualizado por','responsavel pela atualizacao']);
  return c;
}
function lerPlanilha(buf){
  const wb=XLSX.read(buf,{type:'array',cellNF:true,cellDates:false});
  const ocultas=new Set(((wb.Workbook||{}).Sheets||[]).filter(s=>s.Hidden).map(s=>s.name));
  return rotear(wb.SheetNames.map(nome=>({nome, oculta:ocultas.has(nome), grade:()=>grade(wb.Sheets[nome])})));
}
/* JSON do Apps Script: {sheets:[{name,hidden,values:[[...]]}]} */
function lerJSON(d){
  return rotear(arr(d&&d.sheets).map(sh=>({nome:String(sh.name||''), oculta:!!sh.hidden, grade:()=>arr(sh.values).map(r=>{
    const row=arr(r).map(v=>v===null||v===undefined?'':(typeof v==='string'?v.replace(/\r\n?/g,'\n').trim():v));
    while(row.length<11) row.push(''); return row; })})));
}
function rotear(abas){
  errosDados=[]; let home={}, lista=[];
  abas.forEach(({nome,oculta,grade:g_})=>{
    try{
      if(/^(home|inicio|capa)$/.test(norm(nome))) home=lerHome(g_());
      else if(!nome.trim().startsWith('_')&&!oculta) lista.push(lerProjeto(nome,g_()));
    }catch(e){ errosDados.push('Aba "'+nome+'": '+e.message); }
  });
  return {cfg:home, progs:lista};
}
function aplicar(d){
  cfg=d.cfg||{};
  progs=arr(d.progs).map(o=>{ const p=Object.assign({},o);
    p.report=Object.assign({data:'',avancos:'',atencao:'',proximos:''},o.report||{});
    ['escopo','governanca','testes','treinamentos','aprovacoes','passos'].forEach(k=>p[k]=arr(o[k]));
    p.pendencias=p.passos.map(x=>({pendencia:x.acao,dono:x.responsavel,prazo:x.prazo,criticidade:x.criticidade}));   /* seção única: próximos passos / pendências */
    const r=o.raci||{}; p.raci={papeis:arr(r.papeis).map(String),atividades:arr(r.atividades)};
    p.progresso=Math.min(100,num(o.progresso)); return p; });
  progs.forEach((p,i)=>p._id='p'+i);
  if(atual&&!P()) atual=null;
}

/* ═══ UTILITÁRIOS ═══ */
function dataBR(d){ if(vazio(d)) return '—'; const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[3]+'/'+m[2]+'/'+m[1]:esc(d); }
function iso(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:''; }
function diasPara(d){ const i=iso(d); if(!i) return null; const a=new Date(i+'T00:00:00'), h=new Date(); h.setHours(0,0,0,0); return Math.round((a-h)/86400000); }
function textoDias(n){ if(n===null) return ''; if(n===0) return 'hoje'; if(n<0) return Math.abs(n)+(n===-1?' dia atrás':' dias atrás'); return 'em '+n+(n===1?' dia':' dias'); }
function iniciais(p){ const w=(p.nome||'').replace(/[^\p{L}\p{N} ]/gu,' ').split(/\s+/).filter(x=>x.length>1); return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase(); }
const hojeISO=()=>{const d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const P=()=>progs.find(p=>p._id===atual);
function metaAtualizacao(){
  const em=iso(cfg.atualizadoEm);
  return em?'Atualizado em '+dataBR(em)+(vazio(cfg.atualizadoPor)?'':' por '+esc(cfg.atualizadoPor)):'Sem data de atualização';
}
function rodape(meta){
  let marca;
  if(LOGOS.claro&&LOGOS.escuro) marca='<img class="lg-l" src="'+LOGOS.claro+'" alt="MetLife"><img class="lg-d" src="'+LOGOS.escuro+'" alt="MetLife">';
  else if(LOGOS.claro||LOGOS.escuro) marca='<img src="'+(LOGOS.claro||LOGOS.escuro)+'" alt="MetLife">';
  else marca='<span class="fname">MetLife Brasil</span>';
  return '<footer class="pfoot"><div class="fmeta">'+meta+'</div><div class="flogo">'+marca+'</div></footer>';
}

  if(carregando){ app.innerHTML='<div style="padding:120px 0"><div class="spin"></div></div>'; return; }
  const alerta=errosDados.length?'<div class="alerta-dados"><b>Alguns dados não puderam ser lidos.</b> '+errosDados.map(esc).join(' · ')+'</div>':'';
  if(!fonte.tipo){ app.innerHTML=vCarregar(); return; }

const temLetra=(v,l)=>(v||'').split('/').includes(l);

          <div><span class="lbl">RESPONSÁVEL</span><div class="val">${txt(x.responsavel)}</div></div>
          <div><span class="lbl">CRITICIDADE</span><div class="val">${cr?'<span class="dot '+cr[0]+'"></span> ':''}${txt(x.criticidade)}</div></div>

function agoraBR(){ const d=new Date(); return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
function usarPlanilha(buf,tipo,nome){
  const d=lerPlanilha(buf); aplicar(d); fonte={tipo,nome,em:''}; carregando=false; render();
}
function abrirArquivo(f){
  if(!f) return;
  if(!/\.xls[xm]?$/i.test(f.name)){ aviso('Selecione um arquivo Excel (.xlsx).'); return; }
  const rd=new FileReader();
  rd.onload=()=>{ try{ usarPlanilha(new Uint8Array(rd.result),'arquivo',f.name); aviso('Planilha <b>'+esc(f.name)+'</b> carregada · '+progs.length+' projeto'+(progs.length===1?'':'s')+'.'); }
                  catch(e){ errosDados=['Não foi possível ler "'+f.name+'": '+e.message]; carregando=false; render(); } };
  rd.readAsArrayBuffer(f);
}
document.getElementById('arq').addEventListener('change',e=>{ abrirArquivo(e.target.files[0]); e.target.value=''; });
let arrasto=0; const drop=document.getElementById('drop');
window.addEventListener('dragenter',e=>{ if([...(e.dataTransfer.types||[])].includes('Files')){ arrasto++; drop.classList.remove('hide'); } });
window.addEventListener('dragleave',()=>{ if(--arrasto<=0){ arrasto=0; drop.classList.add('hide'); } });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',async e=>{ e.preventDefault(); arrasto=0; drop.classList.add('hide');
  const it=e.dataTransfer.items&&e.dataTransfer.items[0];
  if(it&&it.getAsFileSystemHandle){ try{ const h=await it.getAsFileSystemHandle(); if(h&&h.kind==='file'&&/\.xls[xm]$/i.test(h.name)){ await idbSet('planilha',h); vinculoPendente=null; await lerVinculo(h); aviso('Planilha <b>'+esc(h.name)+'</b> vinculada.'); return; } }catch(_){} }
  abrirArquivo(e.dataTransfer.files[0]); });

function lerRetrato(){
  const el=document.getElementById('hub-retrato'); if(!el) return null;
  const t=el.textContent.trim(); if(!t) return null;
  try{ return JSON.parse(t); }catch(e){ errosDados.push('Retrato embutido inválido: '+e.message); return null; }
}
/* gera uma cópia deste HTML com os dados atuais embutidos (para enviar por e-mail/Teams) */
function baixarPublicado(){
  const dados={cfg, progs:progs.map(({_id,...r})=>r), arquivo:fonte.nome, geradoEm:agoraBR()};
  const json=JSON.stringify(dados).replace(/</g,'\\u003c');
  const abre='<script type="application/json" id="hub-retrato">';
  const i=htmlOriginal.lastIndexOf(abre), j=htmlOriginal.indexOf('<\/script>',i);
  if(i<0||j<0){ aviso('Não foi possível gerar o arquivo.'); return; }
  const html=htmlOriginal.slice(0,i+abre.length)+json+htmlOriginal.slice(j);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const d=new Date(); a.download='Hub_Programas_'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'.html';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  aviso('HTML publicado gerado com os dados de <b>'+esc(fonte.nome)+'</b>.');
}

/* ── planilha vinculada (arquivo sincronizado pelo OneDrive no computador) ──
   O navegador guarda só a "permissão" para o arquivo (IndexedDB deste site).
   Os dados nunca saem do computador. Funciona no Edge e no Chrome.          */
const SUPORTA_VINCULO=typeof window.showOpenFilePicker==='function';
let vinculoPendente=null;
function idb(){ return new Promise((ok,er)=>{ const r=indexedDB.open('hubProgramas',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>er(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(ok=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise(ok=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=ok; t.onerror=ok; }); }catch(e){} }
function quando(ms){ const d=new Date(ms); return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
async function lerVinculo(h){
  const f=await h.getFile();
  usarPlanilha(new Uint8Array(await f.arrayBuffer()),'vinculada',f.name);
  fonte.em=quando(f.lastModified); renderFonte();
}
async function tentarVinculada(){
  const h=await idbGet('planilha'); if(!h) return false;
  try{
    if(await h.queryPermission({mode:'read'})==='granted'){ await lerVinculo(h); return true; }
    vinculoPendente=h; return false;          /* precisa de 1 clique para liberar o acesso nesta sessão */
  }catch(e){ return false; }
}
async function liberarVinculo(){
  const h=vinculoPendente; if(!h) return;
  try{
    if(await h.requestPermission({mode:'read'})!=='granted') return;
    vinculoPendente=null; await lerVinculo(h);
  }catch(e){ aviso('Não foi possível abrir a planilha vinculada. Vincule de novo.'); }
}
async function abrirSeletor(){
  if(!SUPORTA_VINCULO){ document.getElementById('arq').click(); return; }
  try{
    const [h]=await showOpenFilePicker({types:[{description:'Planilha Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx','.xlsm']}}],multiple:false});
    await idbSet('planilha',h); vinculoPendente=null;
    await lerVinculo(h);
    aviso('Planilha <b>'+esc(fonte.nome)+'</b> vinculada. Nas próximas aberturas o hub lê a versão mais recente dela.');
  }catch(e){ if(e.name!=='AbortError') aviso('Não foi possível abrir: '+esc(e.message)); }
}

/* ── tentativas automáticas ── */
let diagSharePoint='';
function comPrazo(ms){ const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal; }
const EH_SCRIPT=u=>/script\.google(usercontent)?\.com\//.test(u||'');
async function tentarOneDrive(){
  if(EH_SCRIPT(ONEDRIVE_URL)){
    try{
      const r=await fetch(ONEDRIVE_URL+(ONEDRIVE_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:comPrazo(20000)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text(); let d;
      try{ d=JSON.parse(t); }catch(_){ throw new Error('o Apps Script devolveu uma página, não os dados — confira se a implantação está como “Qualquer pessoa”'); }
      if(d.erro) throw new Error(d.erro);
      aplicar(lerJSON(d)); fonte={tipo:'onedrive',nome:'Google Sheets',em:''}; carregando=false; render();
      return true;
    }catch(e){ diagSharePoint=e.name==='TypeError'?'acesso recusado — confira se a implantação do Apps Script está como “Qualquer pessoa” e se o link termina em /exec':e.name==='AbortError'?'o Google não respondeu em 20 s':e.message; console.warn('[hub] Apps Script:',e); }
    return false;
  }
  for(const {url:u,cred} of candidatosOneDrive(ONEDRIVE_URL)){
    try{
      const r=await fetch(u,{credentials:cred,mode:'cors',cache:'no-store',signal:comPrazo(8000)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const buf=new Uint8Array(await r.arrayBuffer());
      if(buf[0]!==0x50||buf[1]!==0x4B) throw new Error('o servidor devolveu uma página, não o arquivo');
      usarPlanilha(buf,'onedrive','HUB_PROGRAMAS');
      return true;
    }catch(e){ diagSharePoint=e.name==='TypeError'?'a Google não libera leitura por outro site neste tipo de link — use o link do Apps Script (/exec)':e.name==='AbortError'?'sem resposta em 8 s':e.message; console.warn('[hub] link:',e); }
  }
  return false;
}
async function tentarPlanilhaLocal(){
  try{
    const r=await fetch(PLANILHA+(PLANILHA.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});
    if(!r.ok) return false;
    usarPlanilha(new Uint8Array(await r.arrayBuffer()),'planilha',PLANILHA.split('/').pop().split('?')[0]);
    return true;
  }catch(e){ return false; }
}
async function carregarDados(){
  errosDados=[]; diagSharePoint=''; vinculoPendente=null;
  if(/^https?:\/\//.test(ONEDRIVE_URL)&&await tentarOneDrive()) return;
  if(await tentarPlanilhaLocal()) return;
  if(await tentarVinculada()) return;
  const ret=lerRetrato();
  if(ret){ aplicar(ret); fonte={tipo:'retrato',nome:ret.arquivo||'planilha',em:ret.geradoEm||''}; }
  carregando=false; render();
}
function tentarNovamente(){ carregando=true; render(); carregarDados(); }

document.addEventListener('DOMContentLoaded',()=>{
  htmlOriginal='<!DOCTYPE html>\n'+document.documentElement.outerHTML.replace(/^<html[^>]*>/,'<html lang="pt-BR">');
  render();
  carregarDados();
});
